<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>Inside an AI Memory Core</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="loader" class="loader" aria-live="polite">
      <div class="loader__core"></div>
      <p class="loader__title">memory_core</p>
      <p class="loader__sub"><span id="loader-label">initializing</span></p>
      <div class="loader__bar"><div class="loader__fill" id="loader-fill"></div></div>
    </div>
    <main id="ui" aria-hidden="false">
      <header class="hud hud--tl">
        <span class="hud__dot"></span>
        <span class="hud__label">memory_core</span>
        <span class="hud__sub">offline · last sync —</span>
      </header>
      <header class="hud hud--tr">
        <span class="hud__label">sector</span>
        <span class="hud__sub" id="sector-name">entry</span>
      </header>
      <div class="progress" aria-hidden="true">
        <div class="progress__bar" id="progress-bar"></div>
      </div>
      <section class="prompt" id="prompt">
        <h1 id="prompt-title">inside an ai memory core</h1>
        <p id="prompt-body">scroll to descend.</p>
      </section>
      <section class="outro" id="outro" aria-hidden="true">
        <p class="outro__tag">end_of_record</p>
        <h2 class="outro__line">it remembered you, briefly.</h2>
        <p class="outro__by">harbour.space · webgl in practice · final</p>
      </section>
    </main>
    <button id="audio-toggle" class="audio-toggle" type="button" aria-pressed="false">
      <span class="audio-toggle__dot"></span>
      <span class="audio-toggle__label">audio</span>
    </button>
    <div id="scroll-spacer" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
